name: Build Dextop TCP PoC

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract PoC
        run: |
          unzip -q Dextop-TCP-second-display-poc.zip
          test -f dextop_mod/pubspec.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: dextop_mod
        run: flutter pub get

      - name: Build APK
        working-directory: dextop_mod
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dextop-TCP-PoC
          path: dextop_mod/build/app/outputs/flutter-apk/*.apk
